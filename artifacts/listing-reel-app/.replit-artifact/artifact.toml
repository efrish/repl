kind = "web"
previewPath = "/"
title = "ListingReel"
version = "1.0.0"
id = "artifacts/listing-reel-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23215

[services.development]
run = "pnpm --filter @workspace/listing-reel-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/listing-reel-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/listing-reel-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23215"
BASE_PATH = "/"
